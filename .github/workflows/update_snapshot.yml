name: Update video snapshot

# 7チャンネルの動画マスタを1日1回だけ取得し、リポジトリ内の静的JSONとして配布する。
# アプリ側から YouTube API を呼ばせないための土台。
#
# 生成物: apps/web-arrivals/public/data/videos.json
#   - 新着一覧アプリ  … ビルド時に import する
#   - Streamlit アプリ … 公開URL（/data/videos.json）を fetch する
#
# 同一リポジトリへコミットするので、既定の GITHUB_TOKEN で足りる（PAT は不要）。
# コミットが入ると Vercel が自動で再デプロイし、新着一覧に反映される。
#
# 必要な設定:
#   secrets.YOUTUBE_API_KEY … YouTube Data API v3 のキー

on:
  schedule:
    - cron: "0 14 * * *" # UTC 14:00 = JST 23:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-snapshot
  cancel-in-progress: false

env:
  SNAPSHOT_PATH: apps/web-arrivals/public/data/videos.json

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: パッケージをインストール
        run: pip install -e .

      - name: スナップショットを生成
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m sixfonia_analytics.snapshot --out "$SNAPSHOT_PATH"

      - name: 生成物を検証する
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["SNAPSHOT_PATH"])
          snap = json.loads(path.read_text(encoding="utf-8"))
          print(f"updated_at : {snap['updated_at']}")
          print(f"channels   : {len(snap['channels'])}")
          print(f"videos     : {len(snap['videos'])}")
          print(f"size       : {path.stat().st_size:,} bytes")
          counts = {}
          for v in snap["videos"]:
              counts[v["channel"]] = counts.get(v["channel"], 0) + 1
          for name, n in sorted(counts.items(), key=lambda kv: -kv[1]):
              print(f"  {name:10} {n}")
          assert snap["videos"], "動画が1本も取得できていません"
          assert len(snap["channels"]) == 7, "チャンネル数が7ではありません"
          PY

      - name: コミットする
        run: |
          # 新着が無い日も updated_at を進めるためにコミットする。
          # ここを止めると、アプリ側の鮮度チェック（36時間）が
          # 「取得は成功しているのに古い」と誤検知するため。
          if git diff --quiet -- "$SNAPSHOT_PATH"; then
            echo "差分なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name  "sixfonia-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAPSHOT_PATH"
          git commit -m "chore: update video snapshot ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git push
